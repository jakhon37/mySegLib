# Large Model Configuration (ResNet50/101, EfficientNet)
# Tuned for multi-GPU training without NVLink or GPU peer-to-peer
# Aggressive gradient accumulation to reduce GPU synchronization
# ==========================================

# Experiment settings
experiment:
  name: "segmentation_large_model"
  version: "v1"
  seed: 42

# Data settings
data:
  base_dir: "${DATA_DIR:-./data}"
  dataset_dir: "dataset"
  train_dir: "train"
  val_dir: "val"
  test_dir: "test"
  image_size: 224
  num_classes: 2
  val_split: 0.1

# Model settings
model:
  architecture: "Unet"
  encoder: "resnet50"  # or resnet101, efficientnet-b4, etc.
  encoder_weights: "imagenet"
  activation: "softmax2d"  # Inference and export only: training hands the losses logits
  num_classes: 2

# Training settings - Optimized for large models
training:
  epochs: 100
  batch_size: 64  # Reduced per-GPU batch (model is larger)
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 2  # Reduced for PCIe topology
  mixed_precision: true  # Halves gradient size
  gradient_accumulation_steps: 4  # Reduces sync frequency
                                    # Effective batch = 64 * 4 GPUs * 4 = 1024
                                    # Sync every 4 batches instead of every batch

# Loss settings
loss:
  type: "focal"
  focal_gamma: 2.0
  class_weights: [1.0, 2.0]
  combined_alpha: 0.5

# Scheduler settings
scheduler:
  type: "reduce_on_plateau"
  factor: 0.1
  patience: 5
  min_lr: 0.000001

# Early stopping
early_stopping:
  patience: 50
  min_delta: 0.0001

# Augmentation settings
augmentation:
  train:
    rotate_limit: 360
    rotate_p: 0.5
    h_flip_p: 0.5
    v_flip_p: 0.5
    brightness_limit: 0.3
    contrast_limit: 0.3
    brightness_contrast_p: 0.3
    gamma_limit: [85, 115]
    gamma_p: 0.3
  normalize:
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]
    max_pixel_value: 255.0

# Distributed training settings
distributed:
  backend: "nccl"  # Will auto-fallback to gloo if needed
  find_unused_parameters: false

# Logging settings
logging:
  log_interval: 10
  save_top_k: 3
  tensorboard: true
  wandb: false
  wandb_project: "semantic_segmentation"

# Paths
paths:
  output_dir: "./outputs"
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
